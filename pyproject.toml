[project]
name = "people"
version = "0.1.0"
description = "Surname and notable people question answering app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.0",
    "gradio>=5.0.0",
    "numpy>=2.0.0",
    "streamlit>=1.40.0",
]

[project.scripts]
people = "people:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
